[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borehole-fracture-analysis"
version = "0.1.0"
description = "Image-based borehole fracture segmentation, roughness analysis, reconstruction, and connectivity estimation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["borehole", "fracture", "segmentation", "attention-u-net", "jrc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "Pillow>=10.0",
  "scikit-image>=0.21",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
dev = ["mypy>=1.11", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
borehole-fracture = "borehole_fracture_analysis.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.coverage.run]
branch = true
source = ["borehole_fracture_analysis"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
